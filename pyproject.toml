[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "axon-ai"
version = "0.1.0"
description = "Local-first AI memory system for Markdown notes"
requires-python = ">=3.10"
dependencies = [
    "python-frontmatter>=1.1.0",
    "markdown-it-py>=3.0.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
    "click>=8.1.7",
    "tqdm>=4.66.0",
]

[project.scripts]
axon = "axon.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["axon*"]
